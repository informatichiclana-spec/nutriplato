<!DOCTYPE html>
<html lang="es">
<head>

  <meta name="description" content="Escanea productos, registra tus comidas y controla calorías, macros, peso e IMC.">
  <meta name="theme-color" content="#0f1712">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">

<body>
  <header class="topbar">
    <div class="brand"><img src="icons/icon-192.png" alt=""><span>NutriPlato</span></div>

  <main id="main"></main>

    <button data-tab="progreso"><span class="ni">📈</span><span>Progreso</span></button>
    <button data-tab="perfil"><span class="ni">👤</span><span>Perfil</span></button>

  <script src="js/app.js"></script>
